<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musiciate</title>
<meta name="description" content="Type a word or paste ASCII art and hear it played on a piano roll.">
<style>
  :root {
    --bg: #f4f2ee;
    --panel: #ffffff;
    --border: #e2ddd5;
    --text: #1d1b19;
    --muted: #6f6a63;
    --accent: #6c4cf5;
    --accent-2: #e2457a;
    --roll-bg: #fbfaf8;
    --grid: rgba(0,0,0,0.05);
    --grid-strong: rgba(0,0,0,0.13);
    --key-white: #ffffff;
    --key-black: #2b2a2e;
    --key-white-text: #6f6a63;
    --key-black-text: #c9c6cf;
    --input-bg: #faf9f7;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121117;
      --panel: #1b1a22;
      --border: #2d2b38;
      --text: #ecebf2;
      --muted: #9a97a8;
      --accent: #9d86ff;
      --accent-2: #ff6b9b;
      --roll-bg: #15141b;
      --grid: rgba(255,255,255,0.045);
      --grid-strong: rgba(255,255,255,0.12);
      --key-white: #2a2935;
      --key-black: #0c0b10;
      --key-white-text: #9a97a8;
      --key-black-text: #6d6a7a;
      --input-bg: #15141b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121117; --panel: #1b1a22; --border: #2d2b38; --text: #ecebf2; --muted: #9a97a8;
    --accent: #9d86ff; --accent-2: #ff6b9b; --roll-bg: #15141b;
    --grid: rgba(255,255,255,0.045); --grid-strong: rgba(255,255,255,0.12);
    --key-white: #2a2935; --key-black: #0c0b10; --key-white-text: #9a97a8; --key-black-text: #6d6a7a;
    --input-bg: #15141b; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body { min-height: 100vh; display: flex; flex-direction: column; }
  .wrap { max-width: 1180px; width: 100%; margin: 0 auto; padding: 20px 16px 32px; flex: 1; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .logo { display: inline-flex; align-items: center; gap: 10px; margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .logo svg { flex: none; }
  .logo .word {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .logo small { font-size: 13px; font-weight: 500; letter-spacing: 0; color: var(--muted); }

  footer {
    border-top: 1px solid var(--border); padding: 18px 16px; text-align: center;
    color: var(--muted); font-size: 13px;
  }
  footer strong { color: var(--text); font-weight: 600; }

  /* ---------- AI status pill ---------- */
  .pill {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 7px 14px 7px 10px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--border);
    font-size: 13px; font-weight: 600; min-height: 36px;
    transition: border-color .3s, box-shadow .3s;
  }
  .orb {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--muted); opacity: .5; flex: none;
    transition: background .3s, opacity .3s;
  }
  .eq { display: none; gap: 2px; align-items: flex-end; height: 14px; }
  .eq i { width: 3px; height: 4px; border-radius: 1px; background: var(--accent); display: block; }
  .pill button { display: none; }
  .pill[data-state="composing"], .pill[data-state="tuning"], .pill[data-state="countin"] { border-color: var(--accent); }
  .pill[data-state="composing"] .orb, .pill[data-state="tuning"] .orb, .pill[data-state="countin"] .orb {
    background: conic-gradient(var(--accent), var(--accent-2), var(--accent));
    opacity: 1; animation: spin 1.1s linear infinite;
  }
  .pill[data-state="playing"] { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 15%, transparent); }
  .pill[data-state="playing"] .orb {
    background: radial-gradient(circle at 35% 35%, #fff, var(--accent) 45%, var(--accent-2));
    opacity: 1; animation: pulse 1s ease-in-out infinite;
  }
  .pill[data-state="playing"] .eq { display: inline-flex; }
  .pill[data-state="playing"] .eq i { animation: eq .9s ease-in-out infinite; }
  .pill[data-state="playing"] .eq i:nth-child(2) { animation-delay: -.3s; }
  .pill[data-state="playing"] .eq i:nth-child(3) { animation-delay: -.6s; }
  .pill[data-state="playing"] .eq i:nth-child(4) { animation-delay: -.15s; }
  .pill[data-state="done"] .orb { background: #3fb67b; opacity: .9; }
  .pill[data-state="done"] button { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { transform: scale(.85); box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } 50% { transform: scale(1.1); box-shadow: 0 0 0 7px transparent; } }
  @keyframes eq { 0%,100% { height: 3px; } 50% { height: 14px; } }

  /* ---------- panels ---------- */
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 16px; margin-bottom: 16px; }
  @media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px; min-width: 0; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }

  textarea {
    width: 100%; min-height: 120px; height: 190px; resize: vertical;
    font: 13px/1.25 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    background: var(--input-bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px;
    white-space: pre; overflow: auto;
  }
  textarea:focus, select:focus, input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 999px; cursor: pointer;
    background: transparent; color: var(--text); border: 1px solid var(--border);
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  .controls { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 12px; }
  label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
  select, input[type="range"] { width: 100%; }
  select {
    font: inherit; font-size: 13px; color: var(--text); background: var(--input-bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px;
  }
  input[type="range"] { accent-color: var(--accent); }
  .toggles { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 12px; }
  .switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; user-select: none; }
  .switch input { appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--border); position: relative; cursor: pointer; margin: 0; transition: background .2s; flex: none; }
  .switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .switch input:checked { background: var(--accent); }
  .switch input:checked::after { transform: translateX(14px); }
  .drum-opts { display: contents; }
  .drum-opts.off label.field { opacity: .45; }

  .actions { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  .btn {
    font: inherit; font-weight: 700; font-size: 14px; border: 0; cursor: pointer;
    padding: 10px 22px; border-radius: 10px; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .btn.stop { background: var(--text); color: var(--bg); box-shadow: none; }
  .btn-sm { font: inherit; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; }
  .hint { color: var(--muted); font-size: 12px; }

  .stage { padding: 0; overflow: hidden; }
  .stage canvas { display: block; width: 100%; touch-action: pan-y; cursor: grab; }
  .stage-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 8px 14px; border-top: 1px solid var(--border); }
  #info { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="logo">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent-2)"/></linearGradient></defs>
        <rect x="1" y="1" width="26" height="26" rx="7" fill="url(#lg)"/>
        <rect x="6" y="16" width="6" height="3.5" rx="1.5" fill="#fff"/>
        <rect x="10" y="11" width="9" height="3.5" rx="1.5" fill="#fff" opacity=".85"/>
        <rect x="15" y="6" width="7" height="3.5" rx="1.5" fill="#fff" opacity=".7"/>
        <rect x="13" y="21" width="9" height="2.5" rx="1.25" fill="#fff" opacity=".55"/>
      </svg>
      <span class="word">musiciate</span>
      <small>text → music</small>
    </h1>
    <div class="pill" id="pill" data-state="idle" role="status" aria-live="polite">
      <span class="orb"></span>
      <span id="pillText">Ready</span>
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <button class="btn-sm" id="replay" type="button">Replay</button>
    </div>
  </header>

  <div class="grid">
    <section class="card">
      <h2>Input — a word or ASCII art</h2>
      <textarea id="text" spellcheck="false" aria-label="Text or ASCII art to play"></textarea>
      <div class="presets" id="presets"></div>
    </section>

    <section class="card">
      <h2>Sound</h2>
      <div class="controls">
        <label class="field">Mode
          <select id="mode">
            <option value="auto">Auto-detect</option>
            <option value="word">Word (pixel font)</option>
            <option value="art">ASCII art</option>
          </select>
        </label>
        <label class="field">Instrument
          <select id="instrument">
            <option value="acoustic_grand_piano">Grand piano</option>
            <option value="electric_piano_1">Electric piano</option>
            <option value="marimba">Marimba</option>
            <option value="vibraphone">Vibraphone</option>
            <option value="music_box">Music box</option>
            <option value="celesta">Celesta</option>
            <option value="kalimba">Kalimba</option>
            <option value="orchestral_harp">Harp</option>
            <option value="string_ensemble_1">Strings</option>
            <option value="choir_aahs">Choir</option>
            <option value="flute">Flute</option>
            <option value="church_organ">Church organ</option>
            <option value="steel_drums">Steel drums</option>
            <option value="lead_1_square">Square synth</option>
          </select>
        </label>
        <label class="field">Scale
          <select id="scale">
            <option value="pentatonic">Pentatonic</option>
            <option value="major">Major</option>
            <option value="minor">Minor</option>
            <option value="blues">Blues</option>
            <option value="chromatic">Chromatic</option>
          </select>
        </label>
        <label class="field">Key
          <select id="root">
            <option value="0">C</option><option value="2">D</option><option value="3">E♭</option>
            <option value="4">E</option><option value="5">F</option><option value="7">G</option>
            <option value="9">A</option><option value="10">B♭</option>
          </select>
        </label>
        <label class="field">Tempo <output id="bpmOut">110</output>
          <input id="bpm" type="range" min="40" max="240" value="110">
        </label>
        <div class="drum-opts off" id="drumOpts">
          <label class="field">Drum pattern
            <select id="pattern">
              <option value="text">From the text</option>
              <option value="four">Four-on-the-floor</option>
              <option value="rock">Rock</option>
              <option value="hiphop">Hip-hop</option>
              <option value="bossa">Bossa</option>
            </select>
          </label>
          <label class="field">Drum kit
            <select id="kit">
              <option>TR-808</option>
              <option>LM-2</option>
              <option>Casio-RZ1</option>
              <option>MFB-512</option>
              <option>Roland CR-8000</option>
            </select>
          </label>
          <label class="field">Drum level
            <input id="drumVol" type="range" min="0" max="100" value="70">
          </label>
        </div>
      </div>
      <div class="toggles">
        <label class="switch"><input type="checkbox" id="drums"> Drums</label>
        <label class="switch"><input type="checkbox" id="loop"> Loop</label>
        <label class="switch"><input type="checkbox" id="sustain" checked> Sustain runs</label>
        <label class="switch"><input type="checkbox" id="intro" checked> Intro animation</label>
      </div>
      <div class="actions">
        <button class="btn" id="play" type="button">▶ Play</button>
        <span class="hint">Space = play/stop · click the roll to skip the intro · drag to scroll</span>
      </div>
    </section>
  </div>

  <section class="card stage" id="stage">
    <canvas id="roll" aria-label="Piano roll"></canvas>
    <div class="stage-foot">
      <span id="info"></span>
      <span class="hint" id="loadHint"></span>
    </div>
  </section>
</div>
<footer>Built as part of <strong>Sense Labs</strong> experiments by <strong>Boston Sense</strong></footer>
<script type="module" src="./app.js"></script>
</body>
</html>
